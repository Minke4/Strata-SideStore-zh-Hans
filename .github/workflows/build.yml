name: Strata v2.0.0 Chinese unsigned archive
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Checkout exact upstream release
        uses: actions/checkout@v4
        with:
          repository: huzaifahshahid71-ops/Strata
          ref: refs/tags/v2.0.0
          submodules: recursive
          persist-credentials: false
      - name: Apply preserved Chinese patches
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          data = base64.b64decode('')
          assert hashlib.sha256(data).hexdigest() == '5e6a565a9c25c5cb37c3b5d728046921cccba84f7794e8b4149d507061256754'
          pathlib.Path('/tmp/strata-home-zh.patch').write_bytes(data)
          data = base64.b64decode('')
          assert hashlib.sha256(data).hexdigest() == 'b9b8148ea8f86f11e4334499053da4d042be34b8b7a9bf5d0ed5e79c27ca7f05'
          pathlib.Path('/tmp/strata-jit-zh.patch').write_bytes(data)
          PY
          git apply --check /tmp/strata-home-zh.patch /tmp/strata-jit-zh.patch
          git apply /tmp/strata-home-zh.patch /tmp/strata-jit-zh.patch
          git rev-parse HEAD
          git diff --stat
      - name: Restore pinned bundled dependencies
        run: python3 Scripts/fetch-bundled-dependencies.py
      - name: Build main Strata unsigned archive only
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild archive -project LiveContainer.xcodeproj -scheme LiveContainer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -arch arm64 -archivePath "$RUNNER_TEMP/Strata-zh-Hans.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee "$RUNNER_TEMP/strata-build.log"
      - name: Pack archive
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/Strata-zh-Hans.xcarchive.tar.gz" Strata-zh-Hans.xcarchive
      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: Strata-v2.0.0-zh-Hans-unsigned-xcarchive
          path: ${{ runner.temp }}/Strata-zh-Hans.xcarchive.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strata-build-log
          path: ${{ runner.temp }}/strata-build.log
          if-no-files-found: ignore
          retention-days: 14
